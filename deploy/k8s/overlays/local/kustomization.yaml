apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: katilim-analiz
resources:
  - namespace.yaml
  - ../../base
  - ../../components/local-services
  - ../../operations
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: katilim-analiz-runtime
    literals:
      - postgres-db=katilim_analiz
      - postgres-user=katilim
      - postgres-password=local-development-only
      - database-url=postgresql+asyncpg://katilim:local-development-only@postgres:5432/katilim_analiz
      - migration-database-url=postgresql+asyncpg://katilim:local-development-only@postgres:5432/katilim_analiz
patches:
  - target:
      kind: ConfigMap
      name: katilim-analiz-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: local-kubernetes
      - op: replace
        path: /data/INGEST_NETWORK_ENABLED
        value: "true"
      - op: replace
        path: /data/MODEL_PROFILE
        value: laptop
      - op: replace
        path: /data/APP_CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
  - target:
      kind: Service
      name: api
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
