apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-approved-institution-services
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["api", "worker", "migration", "campaign-scan"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database-infrastructure
          podSelector:
            matchLabels:
              app.kubernetes.io/name: approved-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-infrastructure
          podSelector:
            matchLabels:
              app.kubernetes.io/name: approved-model-service
      ports:
        - protocol: TCP
          port: 11434
