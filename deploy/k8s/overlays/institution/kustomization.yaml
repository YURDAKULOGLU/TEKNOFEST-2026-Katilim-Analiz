apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: katilim-analiz
resources:
  - namespace.yaml
  - ../../base
  - ../../operations
  - api-pdb.yaml
  - network-policies.yaml
replicas:
  - name: api
    count: 2
  - name: worker
    count: 1
patches:
  - target:
      kind: CronJob
      name: campaign-scan
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
  - target:
      kind: ConfigMap
      name: katilim-analiz-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: institution
      - op: replace
        path: /data/MODEL_PROFILE
        value: workstation
      - op: replace
        path: /data/OLLAMA_BASE_URL
        value: http://approved-model-service.ai-infrastructure.svc.cluster.local:11434
