apiVersion: v1
kind: Secret
metadata:
  name: katilim-analiz-runtime
type: Opaque
stringData:
  # Example only. Supply through the institution's secret manager; do not apply as-is.
  # The default institution NetworkPolicy expects a Service whose selected pods
  # carry app.kubernetes.io/name=approved-postgres in database-infrastructure.
  # For an off-cluster managed database, replace this host and add the
  # institution/CNI-specific egress policy for its approved IPs or FQDN.
  database-url: postgresql+asyncpg://USER:PASSWORD@approved-postgres.database-infrastructure.svc.cluster.local:5432/katilim_analiz
  # Use a distinct migration role with the DDL/extension privileges approved by
  # the database platform team. API and worker never receive this credential.
  migration-database-url: postgresql+asyncpg://MIGRATION_USER:MIGRATION_PASSWORD@approved-postgres.database-infrastructure.svc.cluster.local:5432/katilim_analiz
