apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: katilim-analiz
resources:
  - ../offline
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
