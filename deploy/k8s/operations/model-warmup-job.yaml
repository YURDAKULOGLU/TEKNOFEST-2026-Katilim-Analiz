apiVersion: batch/v1
kind: Job
metadata:
  name: model-warmup
  labels:
    app.kubernetes.io/name: katilim-analiz
    app.kubernetes.io/component: model-bootstrap
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: katilim-analiz
        app.kubernetes.io/component: model-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: warmup
          image: curlimages/curl:8.12.1@sha256:88a9abad9d958340e48564f9bdcdaa29916a2984be59314da709f8bbc0eef6f7
          imagePullPolicy: IfNotPresent
          args:
            - --fail-with-body
            - --silent
            - --show-error
            - --max-time
            - "240"
            - --header
            - "Content-Type: application/json"
            - --data
            - '{"model":"qwen3.5:4b","prompt":"","stream":false,"keep_alive":-1}'
            - http://ollama:11434/api/generate
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
