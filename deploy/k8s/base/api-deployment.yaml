apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: katilim-analiz
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: katilim-analiz
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: katilim-analiz
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/yurdakuloglu/katilim-analiz:dev
          imagePullPolicy: IfNotPresent
          args:
            - uvicorn
            - katilim_analiz.api.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --limit-concurrency
            - "32"
            - --proxy-headers
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: katilim-analiz-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: katilim-analiz-runtime
                  key: database-url
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: api.katilim-analiz.svc
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: api.katilim-analiz.svc
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: api.katilim-analiz.svc
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
