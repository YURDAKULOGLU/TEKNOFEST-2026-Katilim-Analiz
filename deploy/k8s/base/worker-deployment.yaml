apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: katilim-analiz
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: katilim-analiz
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: katilim-analiz
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/yurdakuloglu/katilim-analiz:dev
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "katilim_analiz.worker"]
          envFrom:
            - configMapRef:
                name: katilim-analiz-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: katilim-analiz-runtime
                  key: database-url
            # Persist model responses on the private-data PVC (mounted below)
            # so the cache layer survives worker restarts.
            - name: MODEL_RESPONSE_CACHE_DIR
              value: /app/data/private/model-cache
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: private-data
              mountPath: /app/data/private
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: private-data
          persistentVolumeClaim:
            claimName: private-data
