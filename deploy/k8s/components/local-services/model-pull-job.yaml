apiVersion: batch/v1
kind: Job
metadata:
  name: model-pull
  labels:
    app.kubernetes.io/component: model-bootstrap
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: katilim-analiz
        app.kubernetes.io/component: model-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-ollama
          image: curlimages/curl:8.12.1@sha256:88a9abad9d958340e48564f9bdcdaa29916a2984be59314da709f8bbc0eef6f7
          command: ["sh", "-c", "until curl -fsS http://ollama:11434/api/tags; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: pull
          image: ollama/ollama:0.32.0@sha256:67366844c1f0ed498888b8ee804f629d47ff22a4b559d76154154249bff0dd44
          command: ["ollama"]
          args: ["pull", "qwen3.5:4b"]
          env:
            - name: HOME
              value: /tmp
            - name: OLLAMA_HOST
              value: http://ollama:11434
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
